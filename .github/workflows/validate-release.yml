name: Validate release manifest
 
on:

  pull_request:

    branches: [dev, test, main]

  push:

    branches: [dev]
 
jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
 
      - name: Check release manifest

        shell: bash

        run: |

          set -e

          shopt -s nullglob

          files=(releases/*.yaml)

          if (( ${#files[@]} == 0 )); then

            echo "No manifest found in releases/"

            exit 1

          fi

          for f in "${files[@]}"; do

            clean=$(sed -e 's/\r$//' -e '1s/^\xEF\xBB\xBF//' "$f")

            for key in rfc project version commit target_environment; do

              echo "$clean" | grep -q "^${key}:" || { echo "Missing '$key' in $f"; exit 1; }

            done

            echo "OK: $f"

          done
 
  deploy-dev:

    needs: validate

    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - run: echo "DEV deploy would run here. Blocked until REST access is fixed."
